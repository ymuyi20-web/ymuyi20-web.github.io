<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650"><rect width="1400" height="650" fill="#e8eee5"/><path d="M0 570Q400 400 780 600T1400 510" fill="none" stroke="#d4dfcf" stroke-width="2"/><text x="95" y="145" fill="#41694b" font-family="Microsoft YaHei,sans-serif" font-size="19" letter-spacing="5">土壤检测 · 报告工作流</text><text x="95" y="230" fill="#243b2b" font-family="Microsoft YaHei,sans-serif" font-size="52" font-weight="bold">把重复填报，变成清晰流程。</text><text x="95" y="282" fill="#647260" font-family="Microsoft YaHei,sans-serif" font-size="22">数据导入 → 检查 → 人工复核 → 批量生成</text><g font-family="Microsoft YaHei,sans-serif"><rect x="95" y="355" width="250" height="140" rx="8" fill="#fcfcfa"/><text x="125" y="407" font-size="26" fill="#41694b">Excel 数据</text><text x="125" y="451" font-size="18" fill="#687169">匹配样品与检测指标</text><path d="M370 425h45m-10-9 10 9-10 9" stroke="#72916d" fill="none" stroke-width="2"/><rect x="445" y="355" width="250" height="140" rx="8" fill="#fcfcfa"/><text x="475" y="407" font-size="26" fill="#41694b">检查与复核</text><text x="475" y="451" font-size="18" fill="#687169">异常定位 · 指标规则</text><path d="M720 425h45m-10-9 10 9-10 9" stroke="#72916d" fill="none" stroke-width="2"/><rect x="795" y="355" width="400" height="140" rx="8" fill="#41694b"/><text x="830" y="407" font-size="26" fill="#fff">Word + PDF</text><text x="830" y="451" font-size="18" fill="#d6e4d1">按模板生成 · 保留人工审核</text><text x="95" y="573" font-size="16" fill="#687169">工作流程示意 · 非软件界面截图 · 不包含真实客户数据</text></g></svg>
